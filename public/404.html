<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | Aapka (The Health Hub)</title>
    <link rel="icon" type="image/png" href="/aapka-logo.png" />
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #090d16;
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        max-width: 480px;
        background: rgba(30, 41, 59, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 48px 32px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }
      h1 {
        font-size: 72px;
        margin: 0;
        font-family: Georgia, serif;
        color: #2dd4bf;
      }
      h2 {
        font-size: 22px;
        margin: 12px 0;
      }
      p {
        color: #94a3b8;
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 28px;
      }
      a {
        display: inline-block;
        background: #0d9488;
        color: #ffffff;
        text-decoration: none;
        padding: 12px 24px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 14px;
        transition: background 0.2s;
      }
      a:hover {
        background: #14b8a6;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>404</h1>
      <h2>Page Not Found</h2>
      <p>The healthcare page or resource you are looking for does not exist or may have been moved.</p>
      <a href="/">Return to Aapka Home</a>
    </div>
  </body>
</html>
